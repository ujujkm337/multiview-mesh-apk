name: Materialize Android source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize.yml'
      - 'materialize-trigger.txt'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source archive
        run: |
          cat source.part* | base64 -d > source.zip
          unzip -o source.zip
          chmod +x gradlew || true
      - name: Commit restored source
        run: |
          rm -f source.zip
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f app gradle tools settings.gradle.kts build.gradle.kts gradle.properties gradlew README.md .github/workflows/build.yml
          git commit -m 'Restore Android project sources [skip actions]' || true
          git pull --rebase
          git push
