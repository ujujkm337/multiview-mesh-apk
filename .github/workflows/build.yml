name: Build offline APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        id: restore
        continue-on-error: true
        run: |
          set -o pipefail
          cat source.part* | base64 -d > source.zip
          unzip -t source.zip
          unzip -o source.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate bundled ONNX model
        id: model
        continue-on-error: true
        run: |
          set -o pipefail
          pip install onnx==1.17.0 numpy==2.1.3
          python tools/generate_model.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        id: sdk
        continue-on-error: true
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: gradle assembleDebug --stacktrace 2>&1 | tee gradle-build.log
      - name: Write build report
        if: always()
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "restore=${{ steps.restore.outcome }}"
            echo "model=${{ steps.model.outcome }}"
            echo "sdk=${{ steps.sdk.outcome }}"
            echo "assemble=${{ steps.assemble.outcome }}"
            find app/build/outputs -type f 2>/dev/null || true
            tail -n 160 gradle-build.log 2>/dev/null || true
          } > build-report.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add build-report.txt
          git commit -m "Record APK build result [skip actions]" || true
          git push || true
      - name: Publish APK release
        if: ${{ hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete offline-v1 --cleanup-tag -y || true
          gh release create offline-v1 app/build/outputs/apk/debug/app-debug.apk --title "Offline MultiViewMesh APK" --notes "Self-contained debug APK with bundled ONNX model."
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        with:
          name: MultiViewMesh-debug
          path: app/build/outputs/apk/debug/app-debug.apk
