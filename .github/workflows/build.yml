name: Build enhanced APK
on: [push, workflow_dispatch]
permissions: {contents: write}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Restore and patch source
     run: |
      cat source.part* | base64 -d > source.zip
      python - <<'PY'
      import os,struct,zlib
      b=open('source.zip','rb').read();p=0
      while p+30<=len(b) and b[p:p+4]==b'PK\x03\x04':
       _,_,f,m,_,_,_,cs,us,nl,xl=struct.unpack_from('<IHHHHHIIIHH',b,p);n=b[p+30:p+30+nl].decode();st=p+30+nl+xl;raw=b[st:st+cs];out=raw if m==0 else zlib.decompress(raw,-15)
       if n.endswith('/'):os.makedirs(n,exist_ok=True)
       else:os.makedirs(os.path.dirname(n) or '.',exist_ok=True);open(n,'wb').write(out)
       p=st+cs
      os.chmod('gradlew',0o755)
      p='app/src/main/java/dev/multiview/mesh/CameraActivity.kt';s=open(p).read().replace('Capture ${angle.label}\n          Center the object and keep distance consistent','Capture ${angle.label}\\nCenter the object and keep distance consistent');open(p,'w').write(s)
      p='app/src/main/AndroidManifest.xml';s=open(p).read();s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n <application',1) if 'android.permission.INTERNET' not in s else s;s=s.replace('</application>','<activity android:name=".EnhancedSettingsActivity" android:exported="false"/>\n</application>');open(p,'w').write(s)
      p='app/src/main/java/dev/multiview/mesh/MainActivity.kt';s=open(p).read();n='setContentView(R.layout.activity_main)';r='setContentView(R.layout.activity_main); android.widget.Button(this).apply { text="Enhanced settings"; setOnClickListener { startActivity(android.content.Intent(this@MainActivity, EnhancedSettingsActivity::class.java)) }; this@MainActivity.addContentView(this, android.view.ViewGroup.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.WRAP_CONTENT)) }';assert n in s;s=s.replace(n,r,1);open(p,'w').write(s)
      PY
      cp enhanced-src/*.kt app/src/main/java/dev/multiview/mesh/;cp enhanced-src/enhanced_visual_hull.cpp app/src/main/cpp/
      printf '\nadd_library(enhanced_visual_hull SHARED enhanced_visual_hull.cpp)\ntarget_link_libraries(enhanced_visual_hull log)\n' >> app/src/main/cpp/CMakeLists.txt
      sed -i 's/android:scaleType="fillCenter"/android:scaleType="centerCrop"/g' app/src/main/res/layout/activity_camera.xml
      sed -i 's/android:textColor="white"/android:textColor="@android:color\/white"/g' app/src/main/res/layout/activity_viewer.xml
   - uses: actions/setup-python@v5
     with: {python-version: '3.11'}
   - run: pip install onnx==1.17.0 numpy==2.1.3 && python tools/generate_model.py
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
   - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.10.2'}
   - name: Build
     run: gradle assembleDebug 2>&1 | tee gradle-build.log
   - name: Publish
     env: {GH_TOKEN: '${{ github.token }}'}
     run: |
      printf '%s\n' '{"format":"multiview-enhanced-config-v1","name":"Enhanced visual hull package","description":"Public offline configuration and lightweight priors for higher-resolution multi-frame visual-hull reconstruction. Not an LRM.","version":1,"segmentation":{"temporal_frames":3,"consensus_threshold":0.58,"edge_refinement":true},"visual_hull":{"grid_resolution":96,"silhouette_supersampling":2,"smoothing_iterations":4,"min_component_voxels":24},"mesh":{"target_faces":120000,"laplacian_lambda":0.32,"texture_size":2048}}' > enhanced-model-v1.json
      test $(sha256sum enhanced-model-v1.json|cut -d' ' -f1) = 6982f4432a9ac9a5acf8901d27b023696789f0d7d63be0ff3e80e0e2edfd3545
      cp app/build/outputs/apk/debug/app-debug.apk MultiViewMesh-enhanced-debug.apk;sha256sum MultiViewMesh-enhanced-debug.apk > APK-SHA256.txt;wc -c MultiViewMesh-enhanced-debug.apk > APK-SIZE.txt
      gh release delete enhanced-model-v1 --cleanup-tag -y||true;gh release create enhanced-model-v1 enhanced-model-v1.json --title 'Enhanced reconstruction package v1' --notes 'Public SHA-256 verified package; not an LRM.'
      gh release delete v1.2-enhanced --cleanup-tag -y||true;gh release create v1.2-enhanced MultiViewMesh-enhanced-debug.apk APK-SHA256.txt APK-SIZE.txt --title 'MultiViewMesh v1.2 enhanced' --notes 'Optional verified package; fully local after download. Denser multi-frame visual hull, not an LRM.'
   - name: Report
     if: always()
     run: |
      { cat gradle-build.log 2>/dev/null||true;echo SHA=$(sha256sum MultiViewMesh-enhanced-debug.apk 2>/dev/null||true);echo SIZE=$(wc -c < MultiViewMesh-enhanced-debug.apk 2>/dev/null||true); } > build-report.txt
      git config user.name github-actions;git config user.email github-actions@github.com;git add build-report.txt;git commit -m 'Record enhanced build [skip actions]'||true;git pull --rebase||true;git push||true
