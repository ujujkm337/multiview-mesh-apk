name: Inspect Android source
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat source.part* | base64 -d > source.zip
          python - <<'PY'
          import os,struct,zlib
          b=open('source.zip','rb').read();p=0
          while p+30<=len(b) and b[p:p+4]==b'PK\x03\x04':
            _,_,f,m,_,_,_,cs,us,nl,xl=struct.unpack_from('<IHHHHHIIIHH',b,p); n=b[p+30:p+30+nl].decode(); st=p+30+nl+xl; raw=b[st:st+cs]; out=raw if m==0 else zlib.decompress(raw,-15)
            if n.endswith('/'): os.makedirs(n,exist_ok=True)
            else: os.makedirs(os.path.dirname(n) or '.',exist_ok=True);open(n,'wb').write(out)
            p=st+cs
          PY
      - name: Publish source dump
        run: |
          for f in app/src/main/java/dev/multiview/mesh/MainActivity.kt app/src/main/java/dev/multiview/mesh/ModelDownloader.kt app/src/main/java/dev/multiview/mesh/InferencePipeline.kt app/src/main/cpp/mesh_native.cpp app/src/main/res/layout/activity_main.xml app/build.gradle.kts; do echo "===== $f ====="; cat "$f"; done > source-dump.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f source-dump.txt
          git commit -m 'Dump source for enhanced mode [skip actions]'
          git pull --rebase
          git push
