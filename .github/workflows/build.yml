name: Build offline APK
on: [push, workflow_dispatch]
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: cat source.part* | base64 -d > source.zip && unzip -o source.zip
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install onnx==1.17.0 numpy==2.1.3
      - run: python tools/generate_model.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle assembleDebug --stacktrace
      - name: Publish APK release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete offline-v1 --cleanup-tag -y || true
          gh release create offline-v1 app/build/outputs/apk/debug/app-debug.apk --title "Offline MultiViewMesh APK" --notes "Self-contained debug APK with bundled ONNX model."
      - uses: actions/upload-artifact@v4
        with: { name: MultiViewMesh-debug, path: app/build/outputs/apk/debug/app-debug.apk }
